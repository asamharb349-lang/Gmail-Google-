    input:focus, select:focus, textarea:focus {

      border-color: #0b57d0 !important;
      box-shadow: 0 0 0 2px #0b57d0 !important;
    }

    fieldset {

    fieldset:focus-within {
      border-color: #0b57d0 !important;
    }

    legend {

    p {

    input[type="email"],
    input[type="date"],
    select,
    textarea {
      display: block;
      width: 100%;
      margin-top: 6px;

    /* Inline radio option styling */
    input[type="radio"] {

      width: 18px;

      vertical-align: middle;
      cursor: pointer;

    .modal-enter {
      animation: popIn 0.3s ease-out forwards;

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>

        <!-- Filled dynamically by JavaScript -->
      </div>

        Done
      </button>
    </div>
  </div>

  <!-- Interactive JavaScript Logic -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('googleForm');
      const modal = document.getElementById('successModal');
      const modalDetails = document.getElementById('modalDataDetails');
      const closeModalBtn = document.getElementById('closeModalBtn');

      form.addEventListener('submit', (e) => {
        e.preventDefault();

        // Extract Form Data
        const formData = new FormData(form);
        const salutation = formData.get('salutation') !== '--None--' ? formData.get('salutation') : '';
        const firstName = formData.get('firstName') || 'N/A';
        const lastName = formData.get('lastName') || '';
        const gender = formData.get('gender') || 'Not specified';
        const email = formData.get('email') || 'N/A';
        const birthDate = formData.get('birthDate') || 'N/A';
        const address = formData.get('address') || 'N/A';

        const fullName = `${salutation} ${firstName} ${lastName}`.trim();

        // Populate Modal Content
        modalDetails.innerHTML = `
          <div><span class="text-gray-500 text-xs block">Full Name</span> <strong class="text-gray-800">${fullName || 'N/A'}</strong></div>
          <div><span class="text-gray-500 text-xs block">Email</span> <strong class="text-gray-800">${email}</strong></div>
          <div class="grid grid-cols-2 gap-2">
            <div><span class="text-gray-500 text-xs block">Gender</span> <strong class="text-gray-800 capitalize">${gender}</strong></div>
            <div><span class="text-gray-500 text-xs block">Birth Date</span> <strong class="text-gray-800">${birthDate}</strong></div>
          </div>
          <div><span class="text-gray-500 text-xs block">Address</span> <strong class="text-gray-800">${address}</strong></div>
        `;

        // Show Modal
        modal.classList.remove('hidden');
      });

      closeModalBtn.addEventListener('click', () => {
        modal.classList.add('hidden');
        form.reset();
      });
    });
  </script>
</body>
